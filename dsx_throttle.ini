; dsx_throttle.ini - must sit next to version.dll (or dsx_throttle.dll).
; Read once when the DLL loads: change a value, then restart DSX.
[throttle]

; 1 = filter output reports, 0 = pass everything through and only collect statistics.
enabled=1

; Drop a report whose content (without seq number and CRC) equals the last one sent.
dedup=1

; Minimal spacing between reports actually sent to the controller, ms.
; 16 = at most 62.5 packets/s. Try 8 if triggers feel laggy, 32 if audio still stutters.
min_interval_ms=16

; How long a dropped duplicate blocks the DSX writer thread, ms.
; 0 = return immediately (recommended). -1 = same as min_interval_ms.
dup_delay_ms=0

; Renumber the 4-bit sequence counter and recompute CRC32 on forwarded reports.
; Turned off automatically if the CRC of incoming reports does not verify.
rewrite_seq_crc=1

; One log line per write (diagnostics only; stops after trace_max_lines).
trace=0
trace_max_lines=3000

; Statistics line per controller every N seconds (0 = off).
stats_interval_s=10

; log=0 disables the file. log_path is relative to the DLL directory unless absolute.
log=1
log_append=0
log_path=dsx_throttle.log
